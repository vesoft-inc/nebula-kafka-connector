// gRPC requires the proto3 syntax
syntax = "proto3";

package nebula.proto.version;
option go_package = "github.com/vesoft-inc/nebula-ng-tools/golang/pkg/internel/generated_code/v5.0.0/proto/version";
option java_package = "com.vesoft.nebula.proto.version";
option java_multiple_files = true;
option optimize_for = SPEED;

import "google/protobuf/descriptor.proto";

extend google.protobuf.FileOptions {
    bytes protocol_version = 9559;
    repeated bytes supported_versions = 9560;
}

option (protocol_version) = "5.0.0";
// The supported_versions field is used to store the supported versions of the protocol.
// multiple versions are defined in same option repeatedly, such as:
//   option (supported_versions) = "5.0.0";
//   option (supported_versions) = "5.1.0";
option (supported_versions) = "5.0.0";
