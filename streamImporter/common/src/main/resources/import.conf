{
  nebula: {
    graphAddr: "127.0.0.1:9669,127.0.0.1:9670,127.0.0.1:9671"
    graphName: "nba"
    user: "root"
    passwd: "nebula"
    # import or bulkload
    mode: "import"
  }

  mq: {
    server: "127.0.0.1:9092"
    topic: "cluster_nba"
  }

  error: {
    path: "/tmp/errors"
    maxRecords: 10
  }

  sources: [
    {
      type: "hdfs"
      format: "csv"
      path: "hdfs://127.0.0.1:9000/tmp/a.csv"
      header: true
      separator: ","
      readParallel: 10

      pre_processes: {
        concat: [
          {
            oldFields: [a, b]
            newField: "ab"
            sep: "_"
          }
        ]
        separate: [
          {
            oldField: "aaa"
            newFields: [a, b]
            sep: "&"
          }
        ]
        filter: ["aa>=ss"]

        nonValue: ""
      }

      nodetypes: [
        {
          name: "person"
          primaryKey: "a"
          sourceFields: [c, g]
          nebulaFields: [c, g]
          batchSize: 10
          writeParallel: 10
        }
      ]
      edgetypes: [
        {
          name: "friend"
          sourceKey: "a"
          targetKey: "b"
          sourceFields: [c, d, e, f]
          nebulaFields: [c, d, e, f]
          batchSize: 5
          writeParallel: 10
        }
      ]
    }

    {
      type: "hive"
      statement: "select * from db.table"
      readParallel: 10
      pre_processes: {
        concat: [
          {
            oldFields: [a, b]
            newField: "ab"
            sep: "_"
          }
        ]
        separate: [
          {
            oldField: "aaa"
            newFields: [a, b]
            sep: "&"
          }
        ]
        filterIn: [{
          field: "aaa"
          value: "xxx"
        }]
        filterOut: [{
          filed: "aaa"
          value: "xxx"
        }]
        nonValue: ""
      }


      nodetypes: [
        {
          name: "person"
          primaryKey: "a"
          sourceFields: [c, g]
          nebulaFields: [c, g]
          batchSize: 10
          writeParallel: 10
        }
      ]
      edgetypes: [
        {
          name: "friend"
          sourceKey: "a"
          targetKey: "b"
          sourceFields: [c, d, e, f]
          nebulaFields: [c, d, e, f]
          batchSize: 5
          writeParallel: 10
        }
      ]
    }
  ]
}
