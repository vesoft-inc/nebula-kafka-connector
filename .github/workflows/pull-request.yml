# This is temporary action for clients test.

name: pull-request
on:
  push:
    branches: [ master, "release-**" ]
  pull_request:
    branches: [ master, "release-**" ]


jobs:
  kafka-connector:
    runs-on: [ self-hosted, nebula-fast ]
    container:
      image: vesoft/nebula-dev:ubuntu2004
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 1.8
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "8"
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.8.2
      - name: Link maven config file
        run: |
          ln -s /github/home/.m2/ /root/.m2
      - name: Build with Maven
        run: |
          mvn -B package -Dmaven.test.skip=true -Dmaven.javadoc.skip=true

