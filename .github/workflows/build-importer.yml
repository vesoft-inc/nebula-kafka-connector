name: build importer

on:
  pull_request:
    branches: [ master, 'release-**']
    paths:
      - 'importer/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build:
    runs-on: [self-hosted, nebula-fast]
    container:
      image: reg.vesoft-inc.com/ci/ubuntu:20.04-docker
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    defaults:
      run:
        working-directory: ./importer
    steps:
      - uses: webiny/action-post-run@2.0.1
        with:
          run: sh -c "find . -mindepth 1 -delete"
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v4
        with:
          go-version: 1.18
          cache: true
          cache-dependency-path: importer/go.sum
      - run: |
            go env -w GOFLAGS=-buildvcs=false
            git config --global --add safe.directory $(pwd)
      - run: make lint
      - run: make test
      - id: test-coverage
        run: |
          go tool cover -html=coverage.txt -o coverage.html
          output=$(cat coverage.html | grep '<option value="file' | sed -E 's/.*>(.*) \((.*)%\)<.*/\2%\t\1/' | grep -v "_mock.go" | sort)
          echo "output<<EOF"    >> $GITHUB_OUTPUT
          echo "${output}"      >> $GITHUB_OUTPUT
          echo "EOF"            >> $GITHUB_OUTPUT
      - name: Find test coverage comment
        uses: peter-evans/find-comment@v2
        id: fc
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: Importer Test Coverage
      - name: Create or update test coverage comment
        uses: peter-evans/create-or-update-comment@v2
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            Importer Test Coverage
            ${{ steps.test-coverage.outputs.output }}
          edit-mode: replace
