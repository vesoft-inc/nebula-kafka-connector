client:
  version: v5
  address: "127.0.0.1:9669"
  user: root
  password: nebula
  concurrencyPerAddress: 1
  reconnectInitialInterval: 1s
  retry: 3
  retryInitialInterval: 1s

manager:
  graphName: sf
  batch: 128
  readerConcurrency: 50
  importerConcurrency: 512
  statsInterval: 10s
  hooks:
    before:
      - statements:
        # TODO: add `` and rename ttype->type, llength -> length
        - |
          CREATE GRAPH TYPE sf_type IF NOT EXISTS AS GRAPH TYPE {
              (Place(id) LABELS City&Country&Continent {id INT, name STRING, url STRING, ttype STRING}),
              (Organisation(id) LABELS University&Company {id INT, ttype STRING, name STRING, url STRING}),
              (Person(id) LABEL Person {id INT, firstName STRING, lastName STRING, gender STRING, birthday STRING, creationDate STRING, locationIP STRING, browserUsed STRING}),
              (Forum(id) LABEL Forum {id INT, title STRING, creationDate STRING}),
              (Post(id) LABELS Post&Message {id INT, imageFile STRING, creationDate STRING, locationIP STRING, browserUsed STRING, language STRING, content STRING, llength INT}),
              (Comment(id) LABELS Comment&Message {id INT, creationDate STRING, locationIP STRING, browserUsed STRING, content STRING, llength INT}),
              (Tag(id) LABEL Tag {id INT, name STRING, url STRING}),
              (TagClass(id) LABEL TagClass {id INT, name STRING, url STRING}),
              (Place)-[PLACE_IS_PART_OF_PLACE:IS_PART_OF]->(Place),
              (Organisation)-[ORGANISATION_IS_LOCATED_IN_PLACE:IS_LOCATED_IN]->(Place),
              (Person)-[PERSON_IS_LOCATED_IN_PLACE:IS_LOCATED_IN]->(Place),
              (Person)-[PERSON_STUDY_AT_ORGANISATION:STUDY_AT{classYear INT}]->(Organisation),
              (Person)-[PERSON_WORK_AT_ORGANISATION:WORK_AT{workFrom INT}]->(Organisation),
              (Person)-[PERSON_KNOWS_PERSON:KNOWS{creationDate STRING}]->(Person),
              (Person)-[PERSON_LIKES_POST:LIKES{creationDate STRING}]->(Post),
              (Person)-[PERSON_LIKES_COMMENT:LIKES{creationDate STRING}]->(Comment),
              (Person)-[PERSON_HAS_INTEREST_TAG:HAS_INTEREST]->(Tag),
              (Forum)-[FORUM_HAS_MEMBER_PERSON:HAS_MEMBER{joinDate STRING}]->(Person),
              (Forum)-[FORUM_HAS_MODERATOR_PERSON:HAS_MODERATOR]->(Person),
              (Forum)-[FORUM_CONTAINER_OF_POST:CONTAINER_OF]->(Post),
              (Forum)-[FORUM_HAS_TAG_TAG:HAS_TAG]->(Tag),
              (Post)-[POST_IS_LOCATED_IN_PLACE:IS_LOCATED_IN]->(Place),
              (Post)-[POST_HAS_CREATOR_PERSON:HAS_CREATOR]->(Person),
              (Post)-[POST_HAS_TAG_TAG:HAS_TAG]->(Tag),
              (Comment)-[COMMENT_IS_LOCATED_IN_PLACE:IS_LOCATED_IN]->(Place),
              (Comment)-[COMMENT_HAS_CREATOR_PERSON:HAS_CREATOR]->(Person),
              (Comment)-[COMMENT_REPLY_OF_POST:REPLY_OF]->(Post),
              (Comment)-[COMMENT_REPLY_OF_COMMENT:REPLY_OF]->(Comment),
              (Comment)-[COMMENT_HAS_TAG_TAG:HAS_TAG]->(Tag),
              (Tag)-[TAG_HAS_TYPE_TAGCLASS:HAS_TYPE]->(TagClass),
              (TagClass)-[TAGCLASS_IS_SUBCLASS_OF_TAGCLASS:IS_SUBCLASS_OF]->(TagClass)
          }
        wait: 10s
      - statements:
        - CREATE GRAPH sf IF NOT EXISTS OF sf_type
        wait: 5s

