client:
  version: v5
  address: "127.0.0.1:9669"
  user: root
  password: nebula
  concurrencyPerAddress: 1
  reconnectInitialInterval: 1s
  retry: 3
  retryInitialInterval: 1s

manager:
  graphName: basic_string_examples
  batch: 128
  readerConcurrency: 50
  importerConcurrency: 512
  statsInterval: 10s
  hooks:
    before:
      - statements:
        - |
          CREATE GRAPH TYPE IF NOT EXISTS basic_string_examples_type AS GRAPH TYPE {
              (Person(id) LABEL Person {id STRING, firstName STRING, lastName STRING, gender STRING, birthday STRING, creationDate STRING, locationIP STRING, browserUsed STRING}),
              (Person)-[KNOWS:KNOWS{creationDate STRING}]->(Person)
          }
        wait: 10s
      - statements:
        - CREATE GRAPH IF NOT EXISTS basic_string_examples TYPED basic_string_examples_type
        wait: 5s

sources:
  - path: ./person.csv
    csv:
      delimiter: "|"
    nodes:
    - name: Person
      id:
        name: "id"
        type: "STRING"
        concatItems:
          - person_
          - 0
          - _id
      props:
        - name: "firstName"
          type: "STRING"
          index: 1
        - name: "lastName"
          type: "STRING"
          index: 2
        - name: "gender"
          type: "STRING"
          index: 3
          nullable: true
          defaultValue: female
        - name: "birthday"
          type: "STRING"
          index: 4
          nullable: true
          nullValue: _NULL_
          defaultValue: "NULL" # TODO: remove this to support set NULL
        - name: "creationDate"
          type: "STRING"
          index: 5
        - name: "locationIP"
          type: "STRING"
          index: 6
        - name: "browserUsed"
          type: "STRING"
          index: 7
  - path: ./knows.csv
    batch: 256
    edges:
    - name: KNOWS # person_knows_person
      src:
        name: Person
        id:
          name: "id"
          type: "STRING"
          concatItems:
            - person_
            - 0
            - _id
      dst:
        name: Person
        id:
          name: "id"
          type: "STRING"
          concatItems:
            - person_
            - 1
            - _id
      props:
        - name: "creationDate"
          type: "STRING"
          index: 2
          nullable: true
          nullValue: _NULL_
          defaultValue: 0000-00-00T00:00:00

log:
  level: INFO
  console: true
  files:
   - logs/nebula-importer.log
  fields:
    - key: app
      value: nebula-importer
