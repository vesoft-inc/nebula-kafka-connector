client:
  address: "192.168.8.6:39669"
  user: root
  password: nebula
  concurrencyPerAddress: 1
  reconnectInitialInterval: 1s
  retry: 3
  retryInitialInterval: 1s

manager:
  batch: 100
  readerConcurrency: 10
  importerConcurrency: 10
  statsInterval: 10s
  hooks:
    before:
      - statements:
        - |
          CREATE GRAPH TYPE person_int_type IF NOT EXISTS AS GRAPH TYPE {
              (Person(id) LABEL Person {id INT, firstName STRING, lastName STRING, gender STRING, birthday STRING, creationDate STRING, locationIP STRING, browserUsed STRING}),
              (Person)-[KNOWS:KNOWS{creationDate STRING}]->(Person)
          }
        - |
          CREATE GRAPH TYPE person_string_type IF NOT EXISTS AS GRAPH TYPE {
              (Person(id) LABEL Person {id STRING, firstName STRING, lastName STRING, gender STRING, birthday STRING, creationDate STRING, locationIP STRING, browserUsed STRING}),
              (Person)-[KNOWS:KNOWS{creationDate STRING}]->(Person)
          }
        wait: 10s
      - statements:
        - CREATE GRAPH person_int IF NOT EXISTS OF person_int_type
        - CREATE GRAPH person_string IF NOT EXISTS OF person_string_type
        wait: 5s

sources:
  # person_int
  - path: ./person.csv
    csv:
      delimiter: "|"
    graphName: person_int
    nodes:
    - name: Person
      id:
        name: "id"
        type: "INT"
        index: 0
      props:
        - name: "firstName"
          type: "STRING"
          index: 1
        - name: "lastName"
          type: "STRING"
          index: 2
        - name: "gender"
          type: "STRING"
          index: 3
          nullable: true
          defaultValue: male
        - name: "birthday"
          type: "STRING"
          index: 4
          nullable: true
          nullValue: _NULL_
          defaultValue: "NULL" # TODO: remove this to support set NULL
        - name: "creationDate"
          type: "STRING"
          index: 5
        - name: "locationIP"
          type: "STRING"
          index: 6
        - name: "browserUsed"
          type: "STRING"
          index: 7
          nullable: true
          alternativeIndices:
            - 6
    - name: Person
      id:
        name: "id"
        type: "INT"
        index: 0
      props:
        - name: "firstName"
          type: "STRING"
          index: 1
        - name: "lastName"
          type: "STRING"
          index: 2
        - name: "gender"
          type: "STRING"
          index: 3
          nullable: true
          defaultValue: male
        - name: "birthday"
          type: "STRING"
          index: 4
          nullable: true
          nullValue: _NULL_
          defaultValue: "NULL" # TODO: remove this to support set NULL
        - name: "creationDate"
          type: "STRING"
          index: 5
        - name: "locationIP"
          type: "STRING"
          index: 6
        - name: "browserUsed"
          type: "STRING"
          index: 7
          nullable: true
          alternativeIndices:
            - 6
  - path: ./knows.csv
    graphName: person_int
    edges:
    - name: KNOWS # person_knows_person
      src:
        name: Person
        id:
          name: "id"
          type: "INT"
          index: 0
      dst:
        name: Person
        id:
          name: "id"
          type: "INT"
          index: 1
      props:
        - name: "creationDate"
          type: "STRING"
          index: 2
          nullable: true
          nullValue: _NULL_
          defaultValue: 0000-00-00T00:00:00
    - name: KNOWS # person_knows_person
      src:
        name: Person
        id:
          name: "id"
          type: "INT"
          index: 0
      dst:
        name: Person
        id:
          name: "id"
          type: "INT"
          index: 1
      props:
        - name: "creationDate"
          type: "STRING"
          index: 2
          nullable: true
          nullValue: _NULL_
          defaultValue: 0000-00-00T00:00:00

  # person_string
  - path: ./examples/basic/person.csv
    csv:
      delimiter: "|"
    graphName: person_string
    nodes:
    - name: Person
      id:
        name: "id"
        type: "STRING"
        concatItems:
          - person_
          - 0
          - _id
      props:
        - name: "firstName"
          type: "STRING"
          index: 1
        - name: "lastName"
          type: "STRING"
          index: 2
        - name: "gender"
          type: "STRING"
          index: 3
          nullable: true
          defaultValue: female
        - name: "birthday"
          type: "STRING"
          index: 4
          nullable: true
          nullValue: _NULL_
          defaultValue: "NULL" # TODO: remove this to support set NULL
        - name: "creationDate"
          type: "STRING"
          index: 5
        - name: "locationIP"
          type: "STRING"
          index: 6
        - name: "browserUsed"
          type: "STRING"
          index: 7
  - path: ./knows.csv
    graphName: person_string
    edges:
    - name: KNOWS # person_knows_person
      src:
        name: Person
        id:
          name: "id"
          type: "STRING"
          concatItems:
            - person_
            - 0
            - _id
      dst:
        name: Person
        id:
          name: "id"
          type: "STRING"
          concatItems:
            - person_
            - 1
            - _id
      props:
        - name: "creationDate"
          type: "STRING"
          index: 2
          nullable: true
          nullValue: _NULL_
          defaultValue: 0000-00-00T00:00:00

log:
  level: INGO
  console: true
  files:
   - logs/nebula-importer.log
  fields:
    - key: app
      value: nebula-importer
