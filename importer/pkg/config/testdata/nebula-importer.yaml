client:
  address: "127.0.0.1:0"
  user: root
  password: nebula
  concurrencyPerAddress: 10
  reconnectInitialInterval: 1s
  retry: 3
  retryInitialInterval: 1s

manager:
  batch: 100
  readerConcurrency: 10
  importerConcurrency: 10
  statsInterval: 10s
  hooks:
    before:
      - statements:
        - statement1
      - statements:
        - statement2
        wait: 1s

sources:
  - path: ./testdata/node1.csv
    graphName: graphName
    nodes:
    - name: node1
      id:
        name: "id"
        type: "INT"
        index: 0
      props:
        - name: "prop1"
          type: "STRING"
          index: 1
        - name: "prop2"
          type: "int"
          index: 2
        - name: "prop3"
          type: "Double"
          index: 3
    - name: node2
      id:
        name: "id"
        type: "INT"
        index: 0
      props:
        - name: "prop1"
          type: "STRING"
          index: 1
        - name: "prop2"
          type: "int"
          index: 2
        - name: "prop3"
          type: "Double"
          index: 3

  - path: ./testdata/edge1.csv
    graphName: graphName
    edges:
    - name: edge1
      src:
        name: node1
        id:
          name: "id"
          type: "INT"
          index: 0
      dst:
        name: node1
        id:
          name: "id"
          type: "INT"
          index: 1
      props:
        - name: "prop1"
          type: "STRING"
          index: 2
    - name: edge2
      src:
        name: node2
        id:
          name: "id"
          type: "INT"
          index: 0
      dst:
        name: node2
        id:
          name: "id"
          type: "INT"
          index: 1
      props:
        - name: "prop1"
          type: "STRING"
          index: 2
  - path: ./testdata/node1.csv
    graphName: graphName
    nodes:
      - name: node1
        id:
          name: "id"
          type: "INT"
          index: 0
        props:
          - name: "prop1"
            type: "STRING"
            index: 1
          - name: "prop2"
            type: "int"
            index: 2
          - name: "prop3"
            type: "Double"
            index: 3
      - name: node2
        id:
          name: "id"
          type: "INT"
          index: 0
        props:
          - name: "prop1"
            type: "STRING"
            index: 1
          - name: "prop2"
            type: "int"
            index: 2
          - name: "prop3"
            type: "Double"
            index: 3
log:
  level: INGO
  console: true
  files:
   - logs/nebula-importer.log
  fields:
    - key: app
      value: nebula-importer
