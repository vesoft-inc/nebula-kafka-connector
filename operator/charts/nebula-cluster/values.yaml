nebulaCluster:
  console:
    image: vesoft/nebula-console
    version: latest
  replicaFactor: 3
  zones:
    - az1
    - az2
    - az3
  metadRef:
    name: metad-sample
  credentialSecret: "nebula"

  graphd:
    resources:
      requests:
        cpu: "500m"
        memory: "500Mi"
      limits:
        cpu: "1"
        memory: "500Mi"
    replicas: 1
    image: vesoft/nebula-graphd
    version: nightly
    serviceType: NodePort
    logVolume:
      enable: true
      storage: "500Mi"
    storageClassName: local-path
    env: []
    config: {}
    nodeSelector: {}
    affinity: {}
    podLabels: {}
    podAnnotations: {}
    tolerations: []
    readinessProbe: {}
    livenessProbe: {}
    initContainers: []
    sidecarContainers: []
    volumes: []
    volumeMounts: []

  storaged:
    resources:
      requests:
        cpu: "500m"
        memory: "500Mi"
      limits:
        cpu: "2"
        memory: "2Gi"
    replicas: 3
    image: vesoft/nebula-storaged
    version: nightly
    dataVolumes:
    - storage: "10Gi"
    logVolume:
      enable: true
      storage: "1Gi"
    storageClassName: local-path
    env: []
    config: {}
    nodeSelector: {}
    affinity: {}
    enableAutoBalance: false
    podLabels: {}
    podAnnotations: {}
    tolerations: []
    readinessProbe: {}
    livenessProbe: {}
    initContainers: []
    sidecarContainers: []
    volumes: []
    volumeMounts: []

  enablePVReclaim: false
  schedulerName: default-scheduler # nebula-scheduler
  imagePullPolicy: Always
  imagePullSecrets:
  - name: "image-secret"
  topologySpreadConstraints:
  - topologyKey: "kubernetes.io/hostname"
    whenUnsatisfiable: "ScheduleAnyway"
