########## basics ##########

# Whether to run as a daemon process
--daemonize=true

# The file to host the process id
--pid_file=pids/nebula-metad.pid

########## logging ##########
# The directory to host logging files
--log_dir=logs

# Log level, 0, 1, 2, 3 for INFO, WARNING, ERROR, FATAL respectively
--minloglevel=0

# Verbose log level, 1, 2, 3, 4, the higher of the level, the more verbose of the logging
--v=0

# Maximum seconds to buffer the log messages
--logbufsecs=0

# Whether to redirect stdout and stderr to separate output files
--redirect_stdout=true

# Destination filename of stdout and stderr, which will also reside in log_dir.
--stdout_log_file=metad-stdout.log
--stderr_log_file=metad-stderr.log

# Copy log messages at or above this level to stderr in addition to logfiles. The numbers of severity levels INFO, WARNING, ERROR, and FATAL are 0, 1, 2, and 3, respectively.
--stderrthreshold=2

# wether logging files' name contain time stamp, If Using logrotate to rotate logging files, than should set it to true.
--timestamp_in_logfile_name=true

########## meta service ##########
# Comma separated Meta Server addresses
--meta_server_addrs=192.168.8.6:5713

# Local IP used to identify the nebula-metad process.
# Change it to an address other than loopback if the service is distributed or
# will be accessed remotely.
--local_ip=192.168.8.6

# Meta daemon listening port
--port=5713

########## storage ##########
# Root data path, here should be only single path for metad
--data_path=data/meta
