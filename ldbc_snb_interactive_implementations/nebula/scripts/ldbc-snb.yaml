  - path: ./social_network/static/city.csv
    csv:
      delimiter: '|'
    nodes:
      - name: City
        id:
          name: 'id'
          type: 'INT'
          index: 0
        props:
          - name: 'name'
            type: 'STRING'
            index: 1
          - name: 'url'
            type: 'STRING'
            index: 2

