client:
  version: v5
  address: '127.0.0.1:9669'
  user: root
  password: nebula
  concurrencyPerAddress: 1
  reconnectInitialInterval: 1s
  retry: 3
  retryInitialInterval: 1s

manager:
  graphName: ldbc
  batch: 128
  readerConcurrency: 50
  importerConcurrency: 512
  statsInterval: 10s
  hooks:
    before:
      - statements:
          # TODO: add `` and rename extent -> length
          - |
            CREATE GRAPH TYPE IF NOT EXISTS ldbc_type AS {
                (City(id) LABELS City&Place {id INT64, name STRING, url STRING}),
                (Country(id) LABELS Country&Place {id INT64, name STRING, url STRING}),
                (Continent(id) LABELS Continent&Place {id INT64, name STRING, url STRING}),
                (University(id) LABELS University&Organisation {id INT64, name STRING, url STRING}),
                (Company(id) LABELS Company&Organisation {id INT64, name STRING, url STRING}),
                (Person(id) LABEL Person {id INT64, firstName STRING, lastName STRING, gender STRING, birthday DATE, creationDate LOCALDATETIME, locationIP STRING, browserUsed STRING, email STRING, speaks STRING }),
                (Forum(id) LABEL Forum {id INT64, title STRING, creationDate LOCALDATETIME}),
                (Post(id) LABELS Post&Message {id INT64, imageFile STRING, creationDate LOCALDATETIME, locationIP STRING, browserUsed STRING, language STRING, content STRING, extent INT}),
                (Comment(id) LABELS Comment&Message {id INT64, creationDate LOCALDATETIME, locationIP STRING, browserUsed STRING, content STRING, extent INT32}),
                (Tag(id) LABEL Tag {id INT64, name STRING, url STRING}),
                (TagClass(id) LABEL TagClass {id INT64, name STRING, url STRING}),
                (City)-[CITY_IS_PART_OF_COUNTRY:IS_PART_OF]->(Country),
                (Country)-[COUNTRY_IS_PART_OF_CONTINENT:IS_PART_OF]->(Continent),
                (University)-[UNIVERSITY_IS_LOCATED_IN_CITY:IS_LOCATED_IN]->(City),
                (Company)-[COMPANY_IS_LOCATED_IN_COUNTRY:IS_LOCATED_IN]->(Country),
                (Person)-[PERSON_IS_LOCATED_IN_CITY:IS_LOCATED_IN]->(City),
                (Person)-[PERSON_STUDY_AT_UNIVERSITY:STUDY_AT{classYear INT32}]->(University),
                (Person)-[PERSON_WORK_AT_COMPANY:WORK_AT{workFrom INT32}]->(Company),
                (Person)-[PERSON_LIKES_POST:LIKES{creationDate LOCALDATETIME}]->(Post),
                (Person)-[PERSON_LIKES_COMMENT:LIKES{creationDate LOCALDATETIME}]->(Comment),
                (Person)-[PERSON_HAS_INTEREST_TAG:HAS_INTEREST]->(Tag),
                (Person)-[PERSON_KNOWS_PERSON:KNOWS{creationDate LOCALDATETIME}]->(Person),
                (Post)-[POST_IS_LOCATED_IN_COUNTRY:IS_LOCATED_IN]->(Country),
                (Post)-[POST_HAS_CREATOR_PERSON:HAS_CREATOR]->(Person),
                (Post)-[POST_HAS_TAG_TAG:HAS_TAG]->(Tag),
                (Comment)-[COMMENT_IS_LOCATED_IN_COUNTRY:IS_LOCATED_IN]->(Country),
                (Comment)-[COMMENT_HAS_CREATOR_PERSON:HAS_CREATOR]->(Person),
                (Comment)-[COMMENT_HAS_TAG_TAG:HAS_TAG]->(Tag),
                (Comment)-[COMMENT_REPLY_OF_POST:REPLY_OF]->(Post),
                (Comment)-[COMMENT_REPLY_OF_COMMENT:REPLY_OF]->(Comment),
                (Forum)-[FORUM_CONTAINER_OF_POST:CONTAINER_OF]->(Post),
                (Forum)-[FORUM_HAS_MEMBER_PERSON:HAS_MEMBER{joinDate LOCALDATETIME}]->(Person),
                (Forum)-[FORUM_HAS_MODERATOR_PERSON:HAS_MODERATOR]->(Person),
                (Forum)-[FORUM_HAS_TAG_TAG:HAS_TAG]->(Tag),
                (Tag)-[TAG_HAS_TYPE_TAGCLASS:HAS_TYPE]->(TagClass),
                (TagClass)-[TAGCLASS_IS_SUBCLASS_OF_TAGCLASS:IS_SUBCLASS_OF]->(TagClass)
              }
        wait: 10s
      - statements:
          - CREATE GRAPH IF NOT EXISTS ldbc TYPED ldbc_type
        wait: 5s

