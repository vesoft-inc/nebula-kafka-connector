// Q6. Tag co-occurrence
/*
:param [{ personId, tagName }] => { RETURN
  4398046511333 AS personId,
  "Carl_Gustaf_Emil_Mannerheim" AS tagName
}
*/
USE $graphName
MATCH (person:Person {id : $personId})<-[:KNOWS]->{1,2}(friend:Person)
WHERE person <> friend
RETURN distinct friend AS f
NEXT
USE $graphName
MATCH (post:Post)-[:HAS_CREATOR]->(f:Person),
      (post:Post)-[:HAS_TAG]->(t:Tag {name : "$tagName"}),
      (post:Post)-[:HAS_TAG]->(tag:Tag)
WHERE t <> tag
AGGREGATE postCount=count(post) GROUP BY tag
ORDER BY
  postCount DESC,
  tag.name ASC
LIMIT 10
RETURN
  tag.name AS tagName,
  postCount
