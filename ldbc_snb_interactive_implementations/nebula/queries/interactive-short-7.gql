// IS7. Replies of a message
/*
:param messageId: 206158432794
 */
USE $graphName
MATCH (m:Message WHERE m.id = $messageId)<-[:REPLY_OF]-(c:Comment)-[:HAS_CREATOR]->(p:Person)
    OPTIONAL MATCH (m:Message WHERE m.id = $messageId)-[:HAS_CREATOR]->(a:Person)<-[r:KNOWS]->(p:Person)
    ORDER BY c.creationDate DESC, p.id
    RETURN c.id AS commentId,
        c.content AS commentContent,
        c.creationDate AS commentCreationDate,
        p.id AS replyAuthorId,
        p.firstName AS replyAuthorFirstName,
        p.lastName AS replyAuthorLastName,
        CASE r
            WHEN is null THEN false
            ELSE true
        END AS replyAuthorKnowsOriginalMessageAuthor