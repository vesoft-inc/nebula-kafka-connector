// Q3. Friends and friends of friends that have been to given countries
/*
:param [{ personId, countryXName, countryYName, startDate, endDate }] => { RETURN
  6597069766734 AS personId,
  "Angola" AS countryXName,
  "Colombia" AS countryYName,
  1275393600000 AS startDate,
  1277812800000 AS endDate
}
*/
USE $graphName
MATCH (countryX:Country {name : "$countryXName"}),
      (countryY:Country {name : "$countryYName"}),
      (person:Person {id : $personId})
MATCH (city:City)-[:IS_PART_OF]->(country:Country)
Filter country IN List [countryX, countryY]
AGGREGATE cities=collect(city) GROUP BY person, countryX, countryY
MATCH (person:Person{id : $personId})<-[:KNOWS]->{1,2}(friend:Person)-[:IS_LOCATED_IN]->(city:City)
Filter person <> friend AND NOT city IN cities
RETURN DISTINCT friend, countryX, countryY
NEXT
USE $graphName
MATCH (message:Message)-[:HAS_CREATOR]->(friend:Person), (message:Message)-[:IS_LOCATED_IN]->(country:Country)
Filter localdatetime($endDate) > message.creationDate AND message.creationDate >= localdatetime($startDate) AND country IN List [countryX, countryY]
LET
  friend=friend,
  messageX=CASE WHEN country=countryX THEN 1 ELSE 0 END,
  messageY=CASE WHEN country=countryY THEN 1 ELSE 0 END
AGGREGATE xCount=sum(messageX), yCount=sum(messageY) GROUP BY friend
Filter xCount > 0 AND yCount > 0
ORDER BY xCount+yCount DESC, friend.id ASC
LIMIT 20
RETURN friend.id AS friendId,
  friend.firstName AS friendFirstName,
  friend.lastName AS friendLastName,
  xCount,
  yCount,
  xCount + yCount AS xyCount
