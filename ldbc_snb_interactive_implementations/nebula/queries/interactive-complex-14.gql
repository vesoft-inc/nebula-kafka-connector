// Q14. Trusted connection paths
// Requires the Neo4j Graph Data Science library
/*
:param [{ person1Id, person2Id }] => { RETURN
  14 AS person1Id,
  27 AS person2Id
}
USE $graphName
MATCH path0 = ALL SHORTEST PATH (person1:Person {id : $person1Id})-[:KNOWS]-{1,15}(person2:Person {id : $person2Id})
LET pathNodes = nodes(path0)
RETURN
  List[n IN pathNodes | n.id] AS personIdsInPath,
  reduce(
      weight=0.0, idx IN range(1,size(pathNodes)-1) |
      List[prev IN List[pathNodes[idx-1]] |
          List[curr IN List[pathNodes[idx]] |
              weight + size(VALUE {
                  USE $graphName
                  MATCH p = (curr)<-[:HAS_CREATOR]-(:`Comment`)-[:REPLY_OF]->(:Post)-[:HAS_CREATOR]->(prev)
                  RETURN p
              })*1.0 + size(VALUE {
                  USE $graphName
                  MATCH p = (prev)<-[:HAS_CREATOR]-(:`Comment`)-[:REPLY_OF]->(:Post)-[:HAS_CREATOR]->(curr)
                  RETURN p
              })*1.0 + size(VALUE {
                  USE $graphName
                  MATCH p = (prev)-[:HAS_CREATOR]-(:`Comment`)-[:REPLY_OF]-(:`Comment`)-[:HAS_CREATOR]-(curr)
                  RETURN p
              })*0.5
          ]
      ][0][0]
  ) AS pathWight
NEXT
USE $graphName
ORDER BY pathWight DESC
RETURN pathWight
