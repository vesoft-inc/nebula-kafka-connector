// Q14. Trusted connection paths
// Requires the Neo4j Graph Data Science library
/*
:param [{ person1Id, person2Id }] => { RETURN
  14 AS person1Id,
  27 AS person2Id
}
*/

USE $graphName
MATCH path0 = ALL SHORTEST PATH (person1:Person {id:$person1Id})<-[:KNOWS]->*(person2:Person {id:$person2Id})
LET pathNodes = nodes(path0)
LET numNodes = CAST(size(pathNodes)-1 AS INT64)
FOR i IN range(1, numNodes)
LET prev = pathNodes[i-1], curr = pathNodes[i]
RETURN 1.0 * VALUE {MATCH (curr)<-[:HAS_CREATOR]-(:Comment)-[:REPLY_OF]->(:Post)-[:HAS_CREATOR]->(prev) RETURN COUNT(*) AS a GROUP BY ()}
    + 1.0 * VALUE {MATCH (prev)<-[:HAS_CREATOR]-(:Comment)-[:REPLY_OF]->(:Post)-[:HAS_CREATOR]->(curr) RETURN COUNT(*) AS b GROUP BY ()}
    + 0.5 * VALUE {MATCH (prev)<-[:HAS_CREATOR]-(:Comment)<-[:REPLY_OF]->(:Comment)-[:HAS_CREATOR]->(curr) RETURN COUNT(*) AS c GROUP BY ()}
    AS weight, pathNodes
NEXT
RETURN transform(pathNodes, n -> n.id) AS personIdsInPath, SUM(weight) AS pathWeight GROUP BY personIdsInPath
ORDER BY pathWeight DESC
