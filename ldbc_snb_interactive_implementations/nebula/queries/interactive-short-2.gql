// IS2. Recent messages of a person
/*
:param personId: 10995116277795
 */
USE $graphName
MATCH (p:Person WHERE p.id = $personId )<-[:HAS_CREATOR]-(message:Message)
LET messageId=message.id, messageCreationDate=message.creationDate
ORDER BY messageCreationDate DESC, messageId ASC
LIMIT 10
MATCH WALK (message:Message)-[:REPLY_OF]->*(post:Post)-[:HAS_CREATOR]->(person:Person)
ORDER BY messageCreationDate DESC, messageId ASC
RETURN
  messageId,
  CASE WHEN message.content <> ""
        THEN message.content
        ELSE message.imageFile
  END AS messageContent,
  messageCreationDate,
  post.id AS postId,
  person.id AS personId,
  person.firstName AS personFirstName,
  person.lastName AS personLastName
