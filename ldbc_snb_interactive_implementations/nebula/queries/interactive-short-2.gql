// IS2. Recent messages of a person
/*
:param personId: 10995116277795
 */
USE $graphName
MATCH (message:Message)-[:HAS_CREATOR]->(p:Person WHERE p.id = $personId )
LET message=message, messageId=message.id, messageCreationDate=message.creationDate
ORDER BY messageCreationDate DESC, messageId ASC
LIMIT 10
MATCH (message:Message)-[:REPLY_OF]->{0,5}(post:Post),
  (post:Post)-[:HAS_CREATOR]->(person:Person)
ORDER BY messageCreationDate DESC, messageId ASC
RETURN
  messageId,
  coalesce(message.imageFile,message.content) AS messageContent,
  messageCreationDate,
  post.id AS postId,
  person.id AS personId,
  person.firstName AS personFirstName,
  person.lastName AS personLastName
