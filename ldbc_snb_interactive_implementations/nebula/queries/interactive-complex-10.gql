// Q10. Friend recommendation
/*
:param [{ personId, month }] => { RETURN
  4398046511333 AS personId,
  5 AS month
}
*/
USE $graphName
MATCH (person:Person {id : $personId})<-[:KNOWS]->{2}(friend:Person),(friend:Person)-[:IS_LOCATED_IN]->(city:City)
    WHERE friend <> person AND size( VALUE{ USE $graphName MATCH p0 = (friend:Person)<-[:KNOWS]->(person:Person{id : $personId}) RETURN p0} ) = 0
LET birthday = friend.birthday
    FILTER WHERE (birthday.month = $month AND birthday.day >= 21) OR (birthday.month = ($month % 12) + 1 AND birthday.day < 22)
RETURN DISTINCT friend, city, person
NEXT
USE $graphName
OPTIONAL MATCH (friend:Person)<-[:HAS_CREATOR]-(post:Post)
OPTIONAL MATCH (person:Person {id : $personId})-[:HAS_INTEREST]->(m:Tag), (post:Post)-[:HAS_TAG]->(m:Tag)
AGGREGATE tmp = count(m)  GROUP BY friend, city, post
LET cnt = CASE WHEN tmp > 0 THEN 1 ELSE 0 END
AGGREGATE postCount = count(post), commonPostCount = sum(cnt) GROUP BY friend, city
LET commonInterestScore = commonPostCount - (postCount - commonPostCount), personId = friend.id
ORDER BY commonInterestScore DESC, personId ASC
LIMIT 10
RETURN
    personId,
    friend.firstName AS personFirstName,
    friend.lastName AS personLastName,
    commonInterestScore,
    friend.gender AS personGender,
    city.name AS personCityName
