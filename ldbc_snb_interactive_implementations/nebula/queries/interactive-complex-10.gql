// Q10. Friend recommendation
/*
:param [{ personId, month }] => { RETURN
  4398046511333 AS personId,
  5 AS month
}
*/
USE $graphName
MATCH (person:Person {id : $personId})<-[:KNOWS]->{2}(friend:Person WHERE (friend.birthday.month = $month AND friend.birthday.day >= 21) OR (friend.birthday.month = ($month % 12) + 1 AND friend.birthday.day < 22))-[:IS_LOCATED_IN]->(city:City)
    WHERE friend <> person AND NOT EXISTS((person:Person{id : $personId})<-[:KNOWS]->(friend:Person))
RETURN DISTINCT friend, city, person
NEXT
USE $graphName
OPTIONAL MATCH (friend:Person)<-[:HAS_CREATOR]-(post:Post)
OPTIONAL MATCH (p:Person {id : $personId})-[:HAS_INTEREST]->(m:Tag)<-[:HAS_TAG]->(post:Post)
RETURN count(m) AS tmp, friend, city, post GROUP BY friend, city, post
NEXT USE $graphName
LET cnt = CASE WHEN tmp > 0 THEN 1 ELSE 0 END
RETURN count(post) AS postCount, sum(cnt) AS commonPostCount, friend, city GROUP BY friend, city
NEXT USE $graphName
LET commonInterestScore = commonPostCount - (postCount - commonPostCount), personId = friend.id
ORDER BY commonInterestScore DESC, personId ASC
LIMIT 10
RETURN
    personId,
    friend.firstName AS personFirstName,
    friend.lastName AS personLastName,
    commonInterestScore,
    friend.gender AS personGender,
    city.name AS personCityName
