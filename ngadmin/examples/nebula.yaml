version: 1.0
kind: NebulaCluster
rollback: true
installPath: "/home/zhuang.miao/nebula5.x"
spec:
  metad:
    packagePath: "./bin/nebula-graph-5.0-x86_64-glibc-2.17.sh"
    config:
      port: 9559
      test: "test"
    hosts:
      - host: "192.168.8.240:6688"
    clusters:
      - zoneList: [zone1]
        name: cluster_mizy_test
        replica: 1
        partition: 1
        graphd:
          config:
            port: 9669
          hosts:
            - host: "192.168.8.240:6688"
        storaged:
          config:
            port: 9779
          hosts:
            - host: "192.168.8.240:6688"
  license-manager:
    packagePath: "./bin/lm.tar.gz"
    startType: "shell" # systemd or shell, if systemd, need to provide binPath else provide execShellPath
    # for shell
    execShellPath: "./nebula-license-manager/scripts/license-manager.service"
    # for systemd
    execStartPath: "./nebula-license-manager/nebula-license-manager"
    workingDir: "./nebula-license-manager/"
    # if need custom config, provide the path
    configPath: "./nebula-license-manager/etc/nebula-license-manager.yaml"
    # config key need be seem with the process config yaml key
    config:
      Port: 9119
      Test: "test"
    hosts:
      - host: "192.168.8.240:6688"
