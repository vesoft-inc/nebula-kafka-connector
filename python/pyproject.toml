[project]
name = "nebulagraph-python"
version = "5.0.0a1"
description = "NebulaGraph 5.0 Python Client"
authors = [
    {name = "NebulaGraph Team", email = "info@vesoft.com"},
]
dependencies = [
    "grpcio>=1.59.0",
    "protobuf>=4.25.1",
    "rich>=13.9.3",
    "jinja2>=3.1.4"
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "Apache 2.0"}

[project.scripts]
ngcli = "ng_console:console"

[project.optional-dependencies]
console = [
    "click>=8.1.7",
    "prompt-toolkit>=3.0.48",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pdm.dev-dependencies]
dev = [
    "pandas>=2.2.3",
    "grpcio-tools==1.59.0",
    "grpcio==1.59.0",
    "protobuf==4.25.1",
]

[tool.ruff]
target-version = "py39"
exclude = ["src/nebulagraph_python/proto"]

[tool.ruff.lint]
select = ["E", "F", "G", "B", "I", "SIM", "TID", "PL", "RUF"]


ignore = [
    "E501",    # Line too long
    "E402",    # Module level import not at top of file
    "PLR2004", # Magic value
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments in function definition
    "PLR0915", # Too many statements
]
[tool.ruff.lint.isort]
known-first-party = ["nebulagraph_python"]

[tool.pytest.ini_options]
addopts = "--log-cli-level=INFO"

[tool.pdm.scripts]
check = { shell = 'ruff check && ruff format --check' }
fix = { shell = "ruff check --fix && ruff format" }
proto_gen = { shell = "python proto/scripts/update_proto.py && python proto/scripts/generate_proto.py" } 